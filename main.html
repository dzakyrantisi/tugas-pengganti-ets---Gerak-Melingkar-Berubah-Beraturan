<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulasi Kipas Angin - GLBB Rotasi</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; flex-direction:row; align-items:flex-start; justify-content:center; gap:16px; background:#edf1f5; padding:16px; color:#1f2933; }
    #gl-canvas { border:1px solid #b0bec5; background:#1a1a1a; box-shadow:0 4px 16px rgba(0,0,0,0.18); border-radius:10px; }
    .controls { width:360px; max-height:95vh; overflow:auto; background:#fff; padding:14px; border-radius:10px; box-shadow:0 4px 18px rgba(15,23,42,0.15); font-size:13px; }
    .controls h3 { margin:0 0 10px; font-size:18px; color:#0b2e4a; }
    .section { margin:12px 0; padding:10px; border:1px solid #d0d7de; border-radius:8px; background:#f9fbfd; }
    .section h4 { margin:0 0 8px; font-size:14px; color:#183a59; }
    .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
    label { width:130px; font-size:13px; }
    input[type="range"] { flex:1; }
    input[type="color"] { border:none; background:none; padding:0; width:40px; height:22px; }
    button { width:100%; padding:8px 10px; border:none; border-radius:6px; background:#0b72b9; color:#fff; font-weight:bold; cursor:pointer; }
    button:hover { background:#095f98; }
    .value-pill { min-width:54px; text-align:right; font-weight:bold; color:#0b2e4a; }
    .output-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
    .output-item { background:#fff; border:1px solid #dce3eb; border-radius:6px; padding:8px; display:flex; flex-direction:column; }
    .output-item span { font-size:12px; color:#536471; }
    .output-item strong { font-size:16px; margin-top:4px; color:#0b2e4a; }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
    @media (max-width: 1200px) {
      body { flex-direction:column; align-items:center; }
      #gl-canvas { width:100%; height:auto; max-width:720px; aspect-ratio:1/1; }
      .controls { width:100%; max-width:720px; }
    }
  </style>
</head>
<body>

<canvas id="gl-canvas" width="720" height="720"></canvas>

<div class="controls">
  <h3>Kipas Angin 3D &amp; GLBB Rotasi</h3>

  <div class="section">
    <h4>Parameter Gerak</h4>
    <div class="row">
      <label for="omega0Input">ω₀ (rad/s)</label>
      <input id="omega0Input" type="range" min="0" max="20" step="0.1" value="6" />
      <div class="value-pill" id="omega0Value">6.00</div>
    </div>
    <div class="row">
      <label for="alphaInput">α (rad/s²)</label>
      <input id="alphaInput" type="range" min="-5" max="5" step="0.05" value="0.8" />
      <div class="value-pill" id="alphaValue">0.80</div>
    </div>
    <div class="row">
      <label for="timeInput">waktu t (s)</label>
      <input id="timeInput" type="range" min="0" max="25" step="0.01" value="0" />
      <div class="value-pill" id="timeValue">0.00</div>
    </div>
    <div class="toggle-row">
      <label for="autoTimeToggle">Otomatis (t berjalan)</label>
      <input id="autoTimeToggle" type="checkbox" checked />
    </div>
    <button id="resetTimeBtn">Setel Ulang Waktu</button>
  </div>

  <div class="section">
    <h4>Hasil Perhitungan</h4>
    <div class="output-grid">
      <div class="output-item">
        <span>θ(t) (rad)</span>
        <strong id="thetaValue">0.00</strong>
      </div>
      <div class="output-item">
        <span>ω(t) (rad/s)</span>
        <strong id="omegaValue">0.00</strong>
      </div>
      <div class="output-item">
        <span>v(t) (m/s)</span>
        <strong id="linearValue">0.00</strong>
      </div>
      <div class="output-item">
        <span>a<sub>t</sub> (m/s²)</span>
        <strong id="tangentialValue">0.00</strong>
      </div>
    </div>
  </div>

  <div class="section">
    <h4>Transformasi Objek</h4>
    <div class="row"><label for="rotateX">Rotasi X</label><input id="rotateX" type="range" min="-90" max="90" step="1" value="0" /></div>
    <div class="row"><label for="rotateY">Rotasi Y</label><input id="rotateY" type="range" min="-180" max="180" step="1" value="0" /></div>
    <div class="row"><label for="rotateZ">Rotasi Z</label><input id="rotateZ" type="range" min="-180" max="180" step="1" value="0" /></div>
    <div class="row"><label for="transX">Geser X</label><input id="transX" type="range" min="-2" max="2" step="0.01" value="0" /></div>
    <div class="row"><label for="transY">Geser Y</label><input id="transY" type="range" min="-2" max="2" step="0.01" value="-0.2" /></div>
    <div class="row"><label for="transZ">Geser Z</label><input id="transZ" type="range" min="-10" max="-2" step="0.01" value="-7" /></div>
    <div class="row"><label for="scale">Skala</label><input id="scale" type="range" min="0.5" max="2.5" step="0.01" value="1" /></div>
  </div>

  <div class="section">
    <h4>Kamera</h4>
    <div class="row"><label for="camX">Kamera X</label><input id="camX" type="range" min="-10" max="10" step="0.1" value="0" /></div>
    <div class="row"><label for="camY">Kamera Y</label><input id="camY" type="range" min="-10" max="10" step="0.1" value="0.6" /></div>
    <div class="row"><label for="camZ">Kamera Z</label><input id="camZ" type="range" min="2" max="15" step="0.1" value="6.5" /></div>
  </div>

  <div class="section">
    <h4>Pencahayaan</h4>
    <div class="row"><label for="ambientColor">Ambient</label><input id="ambientColor" type="color" value="#595959" /></div>
    <div class="row"><label for="diffuseColor">Diffuse</label><input id="diffuseColor" type="color" value="#bfbfbf" /></div>
    <div class="row"><label for="specularColor">Specular</label><input id="specularColor" type="color" value="#ffffff" /></div>
    <div class="row"><label for="lightX">Light X</label><input id="lightX" type="range" min="-10" max="10" step="0.1" value="3" /></div>
    <div class="row"><label for="lightY">Light Y</label><input id="lightY" type="range" min="-10" max="10" step="0.1" value="4" /></div>
    <div class="row"><label for="lightZ">Light Z</label><input id="lightZ" type="range" min="-10" max="10" step="0.1" value="4" /></div>
  </div>

  <button id="resetBtn">Reset Seluruh Parameter</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="main.js"></script>

</body>
</html>
